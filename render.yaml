services:
  - type: web
    name: radju-bot
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: >-
      python bot.py set-webhook &&
      gunicorn bot:app
      --bind 0.0.0.0:$PORT
      --workers 1
      --threads 4
      --timeout 180

    healthCheckPath: /health

    envVars:
      - key: TELEGRAM_TOKEN
        sync: false

      - key: API_KEY
        sync: false

      - key: PYTHONUNBUFFERED
        value: "1"
