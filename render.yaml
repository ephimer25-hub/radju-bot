services:
  - type: web
    name: radju-bot
    runtime: python
    # Указываем стабильную версию Python (3.11 или 3.10 предпочтительнее для python-telegram-bot)
    runtimeVersion: "3.11.9" 

    # Команда сборки зависимостей
    buildCommand: pip install -r requirements.txt

    # ИСПРАВЛЕНО: Прямой асинхронный запуск скрипта бота без gunicorn
    startCommand: python bot.py

    # ИСПРАВЛЕНО: Обязательные переменные окружения для работы Раджу
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false

      - key: PROXY_API_KEY
        sync: false

      - key: RENDER_EXTERNAL_URL
        sync: false

      - key: PYTHONUNBUFFERED
        value: "1"
